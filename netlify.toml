# This Netlify site serves the PLANNER app (apps/planner), not the tracker at
# the repository root.
#
# `base` makes Netlify cd into apps/planner before installing and building, so
# it picks up that app's own package.json and package-lock.json. `publish` and
# `command` are resolved relative to `base`, so "dist" means apps/planner/dist —
# the directory the Nitro netlify preset writes, carrying the _headers and
# _redirects files Netlify's post-processing checks read.
#
# apps/planner/netlify.toml declares the same command and publish directory, so
# the build resolves identically whether Netlify reads this file or that one
# (it reads the one in the base directory when a base is configured in the UI).
#
# To point this site back at the root tracker instead, delete the `base` line.
[build]
  base = "apps/planner"
  command = "npm run build"
  publish = "dist"

# Pin the toolchain rather than inheriting whatever default the site was created
# with — this build needs a modern Node, and an older default fails obscurely.
[build.environment]
  NODE_VERSION = "22"
